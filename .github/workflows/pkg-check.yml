name: pkg-check

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pkg-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run package integrity check
        id: check
        shell: bash
        run: bash tools/ci/pkg_check.sh

      - name: Run repository and package maintenance tests
        shell: bash
        run: python3 -m unittest discover -s tests/ci -v

      - name: Check documentation links and installed help
        shell: bash
        run: python3 tools/ci/documentation_check.py

      - name: Upload debug artifact
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: debug-pkg-check
          path: |
            rdistnn.pkg
            stata.toc
            src/
          if-no-files-found: warn
          retention-days: 14

  save_logs:
    if: ${{ !cancelled() && always() && needs.pkg-check.result != 'success' && github.actor != 'github-actions[bot]' }}
    needs: [pkg-check]
    uses: ./.github/workflows/harvest-failure-logs.yml
    with:
      logs_dir: GH_logs/pkg-check
      artifact_pattern: debug-pkg-check*
      harvested_artifact_name: harvested-pkg-check-logs
